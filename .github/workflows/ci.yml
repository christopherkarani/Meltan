name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Debug)
        run: swift build

      - name: Build (Release)
        run: swift build -c release

      - name: Run Tests
        run: swift test --skip FullGPUSearchTests
        timeout-minutes: 15

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: swift-format lint --strict --recursive Sources Tests
